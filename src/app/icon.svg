<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="100%" stop-color="#D95A2B" />
    </linearGradient>
    <linearGradient id="innerDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1C12" />
      <stop offset="100%" stop-color="#1E0B05" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <!-- Outer White Rotated Diamond -->
  <g filter="url(#subtleShadow)">
    <rect x="156" y="156" width="200" height="200" rx="36" transform="rotate(45 256 256)" fill="#FFFFFF" />
  </g>

  <!-- Inner Dark Brand Diamond -->
  <rect x="196" y="196" width="120" height="120" rx="20" transform="rotate(45 256 256)" fill="url(#innerDiamondGrad)" />

  <!-- Upward Trend Accent Inside Inner Diamond -->
  <path d="M228 274 L250 252 L266 268 L288 238" stroke="#FF7A45" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="274,238 288,238 288,252" stroke="#FF7A45" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
